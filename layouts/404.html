{{ define "main" }}
<main id="main">
    <div class="px-4 py-8 mx-auto max-w-screen-xl lg:py-16 lg:px-6">
        <div class="mx-auto max-w-screen-sm text-center">
            <h1 class="mb-4 text-8xl font-black tracking-tight lg:text-7xl xl:text-9xl text-primary-600 dark:text-primary-300">
                404
            </h1>
            <p class="mb-4 text-3xl font-bold tracking-tight text-gray-900 md:text-4xl dark:text-white">
                This page went off the map.
            </p>
            <p class="mb-6 text-lg text-gray-600 dark:text-gray-400">
                The page you're looking for doesn't exist or may have moved. Try one of these instead:
            </p>
            <div class="flex flex-wrap gap-3 justify-center">
                <a href="{{ "/" | relURL }}" class="px-5 py-2.5 font-bold text-white rounded-lg border-2 border-primary-600 bg-primary-600 hover:bg-primary-700 hover:border-primary-700">Home</a>
                <a href="{{ "projects/" | relURL }}" class="px-5 py-2.5 font-bold rounded-lg border-2 text-primary-600 border-primary-600 hover:bg-primary-50 dark:text-primary-300 dark:border-primary-300 dark:hover:bg-gray-800">Projects</a>
                <a href="{{ "experience/" | relURL }}" class="px-5 py-2.5 font-bold rounded-lg border-2 text-primary-600 border-primary-600 hover:bg-primary-50 dark:text-primary-300 dark:border-primary-300 dark:hover:bg-gray-800">Experience</a>
                <a href="{{ "contact/" | relURL }}" class="px-5 py-2.5 font-bold rounded-lg border-2 text-primary-600 border-primary-600 hover:bg-primary-50 dark:text-primary-300 dark:border-primary-300 dark:hover:bg-gray-800">Contact</a>
            </div>
        </div>
    </div>
</main>
{{ end }}
