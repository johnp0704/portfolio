baseURL: 'https://portfolio-john-poirier.netlify.app/'
title: John Poirier | Portfolio
languageCode: en-us
DefaultContentLanguage: en
enableEmoji: true
enableGitInfo: false
enableRobotsTXT: true
buildFuture: true
canonifyURLs: false
pagination:
  pagerSize: 9
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: false
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: John Poirier
  logo: "images/logo_v1.png"
  authorimage: "images/JohnPoirier.png"
  og_image: "images/JohnPoirier.png"
  moto: "Robotic Systems through the lens of Electrical Engineering"
  description: "Portfolio of John Poirier, showcasing work in robotics, computer vision, control systems, and electronics."
  seeking: "Looking for Summer 2027 Internships and Fall 2027 Co-Ops"
  disable_theme_toggle: false
  disable_stay_uptodate: true

  p1:
    heading: "Who Am I?"
    image: "images/JohnPoirier.png"
    # Paragraphs support Markdown, e.g. [link text](/page/)
    content:
      - text: "My name is John Poirier, and I’m an engineering student studying electrical engineering and robotics. I’m pursuing an M.S. in Robotics at Northeastern University, concentrating in Electrical Engineering, after graduating summa cum laude from the University of Vermont with a B.S. in Electrical Engineering and a Certificate in Autonomy and Robotics."
      - text: "I enjoy working across a robot’s whole stack, from the PCBs and drivers to the controllers and perception that let it act on its own. As the software and autonomy lead on my senior capstone, I built the navigation, control, and machine learning for an autonomous weeding robot. Other projects range from a line-following robot on a PCB I designed to EKF SLAM in ROS2 and inverse kinematics for a robotic arm."
      - text: "In the future, I hope to work in marine robotics, working on ROVs, floats, AUVs, UUVs, and other devices for ocean exploration and data acquisition."
      - text: "I’m looking for Summer 2027 internships and Fall 2027 co-ops in robotics and autonomy. Take a look at my [projects](/projects/), or reach out through the [Contact page](/contact/)."
  p2:
    heading: "Education & Experience"
    content:
      - text: "My education spans three universities in two countries: a B.S. in Electrical Engineering at the University of Vermont, including a semester abroad at the Auckland University of Technology in New Zealand, and now an M.S. in Robotics at Northeastern University."
      - text: "Alongside my studies, I've designed power, lighting, and fire alarm systems for commercial buildings as an electrical engineering intern at DuBois & King, taught embedded systems as a teaching assistant for UVM's Microcontroller Systems course, and researched GPU-accelerated optimization for renewable energy dispatch. Now I develop ROS 2 software for Northeastern's MATE ROV competition team."
      - text: "The timeline below shows how it all fits together. Click any entry for details."
  p3:
    heading: "Recent Projects"
    content:
      - text: "The most recent projects I have worked on, big or small."

  social_media:
    github:
      enabled: true
      url: 'https://github.com/johnp0704?tab=repositories'
    facebook:
      enabled: false
      url: ''
    instagram:
      enabled: false
      url: ''
    twitter:
      enabled: false
      url: ''
    linkedin:
      enabled: true
      url: 'https://www.linkedin.com/in/john-poirier/'
    

menu:
  main:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 10
    - identifier: experience
      name: Experience
      url: /experience/
      weight: 15
    - identifier: resume
      name: Resume
      url: /resume/
      weight: 20
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 50

frontmatter:
  date: [end_date, date, publishDate, lastmod]

taxonomies:
  tag: tags

privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: false
    useSessionStorage: false
  instagram:
    disable: false
    simple: false
  twitter:
    disable: false
    enableDNT: false
    simple: false
  vimeo:
    disable: false
    enableDNT: false
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true

module:
  hugoVersion:
    extended: true
    min: "0.148.2"
  # Use the TailBliss theme for everything except its demo content (posts, prose, etc.)
  imports:
    - path: tailbliss
      mounts:
        - { source: layouts, target: layouts }
        - { source: assets, target: assets }
        - { source: static, target: static }
        - { source: i18n, target: i18n }
        - { source: archetypes, target: archetypes }